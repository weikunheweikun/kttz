<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1eb" />
  <meta name="description" content="快艇骰子 13 格玩法，跨轮保留骰子每颗花费 3 分，快艇 60 分，支持 AI 对战与 WebRTC P2P 双人联机。" />
  <title>快艇骰子 · 留骰对决</title>
  <link rel="stylesheet" href="styles.css?v=12" />
  <script defer src="core.js?v=12"></script>
  <script defer src="ai_base.js?v=12"></script>
  <script defer src="ai.js?v=12"></script>
  <script defer src="app.js?v=12"></script>
</head>
<body>
  
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">Y.</span><div><strong>快艇骰子</strong><span>YACHT / 13 ROUNDS</span></div></div>
      <div class="header-actions"><span id="connectionTag" class="connection-tag" hidden></span><button class="button subtle" id="rulesButton">玩法</button><button class="button top-new" id="newGameButton">新对局 ＋</button></div>
    </header>
    <main>
      <div id="game" aria-live="polite"></div>
    </main>
    <footer class="page-footer">YACHT · 13 格计分 / 最多 3 掷 / 快艇 60 分</footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop hidden" id="mainModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top"><h2 id="modalTitle"></h2><button type="button" class="icon-button" data-close-modal aria-label="关闭">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>
</body>
</html>
